<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>決済画面へ移動しています - Thai Poca</title>
<link rel="icon" href="icon-192.png">
<style>
:root{ --cream:#f3ead8; --dark:#262523; --dark2:#1d1c1b; --gold:#d49a78; --muted:#9a948a; --line-dark:#3b3935; }
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark2);color:var(--cream);font-family:-apple-system,"Hiragino Sans","Zen Maru Gothic",sans-serif;
  min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px 16px;text-align:center;}
.box{width:100%;max-width:380px;}
.logo{font-size:22px;font-weight:800;margin-bottom:28px;}
.spinner{width:34px;height:34px;margin:0 auto 18px;border:3px solid var(--line-dark);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.txt{font-size:14px;line-height:1.8;}
.sub{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:10px;}
.err{display:none;}
.btn{display:block;width:100%;padding:13px;margin-top:18px;border-radius:12px;border:none;font-size:14px;font-weight:700;font-family:inherit;text-decoration:none;cursor:pointer;}
.btn.main{background:var(--gold);color:var(--dark);}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line-dark);}
</style>
</head>
<body>
<div class="box">
  <div class="logo">Thai Poca</div>
  <div id="wait">
    <div class="spinner"></div>
    <div class="txt" id="waitTxt">決済画面(Stripe)へ移動しています…</div>
    <div class="sub">まだ支払いは発生していません。<br>次の画面で内容を確認してからお支払いください。</div>
  </div>
  <div class="err" id="err">
    <div class="txt" id="errTxt"></div>
    <button class="btn main" id="retry" type="button">もう一度試す</button>
    <a class="btn ghost" href="lp.html#price">料金のページを見る</a>
  </div>
</div>
<script>
// アプリの有料版の案内から開く中継ページ(buy.html?plan=yearly)。購入画面を作って、すぐ Stripe へ移動する
(function(){
  // 販売開始時に true にする(app.html の PAYWALL_LIVE、lp.html と thankyou.html の SALE_LIVE と一緒に)
  var SALE_LIVE = false;
  var API = 'https://thai-poca-payment.takatobi.workers.dev/api';
  var NAMES = { monthly:'月額プラン(¥300)', yearly:'年間プラン(¥3,000)', lifetime:'買い切り(¥4,000)' };
  var q = new URLSearchParams(location.search);
  var plan = q.get('plan');
  var test = q.get('paytest') === '1';
  function fail(msg){ document.getElementById('wait').style.display='none'; document.getElementById('errTxt').innerHTML=msg; document.getElementById('err').style.display='block'; }
  function go(){
    document.getElementById('err').style.display='none'; document.getElementById('wait').style.display='block';
    fetch(API + '/checkout', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({plan:plan}) })
      .then(function(r){ return r.json().then(function(d){ return {s:r.status, d:d}; }); })
      .then(function(x){
        if(x.d && x.d.url){ location.replace(x.d.url); return; }
        fail(x.s===429 ? '短い時間に何度も試されたため、一時的に止めています。<br>1分ほど待ってからお試しください。' : '決済画面を開けませんでした。<br>時間をおいて、もう一度お試しください。');
      })
      .catch(function(){ fail('通信できませんでした。<br>ネットにつながっているか確かめて、もう一度お試しください。'); });
  }
  document.getElementById('retry').onclick = go;
  if(!NAMES[plan]){ fail('プランが選ばれていません。<br>料金のページからお選びください。'); document.getElementById('retry').style.display='none'; return; }
  if(!SALE_LIVE && !test){ fail('有料プランは現在準備中です。'); document.getElementById('retry').style.display='none'; return; }
  document.getElementById('waitTxt').textContent = NAMES[plan] + 'の決済画面(Stripe)へ移動しています…';
  go();
})();
</script>
</body>
</html>
