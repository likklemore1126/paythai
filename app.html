<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ป้ายไทย">
<meta name="theme-color" content="#1c1b1f">
<title>ป้ายไทย — タイ語学習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;700&family=Sriracha&family=Zen+Maru+Gothic:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1b1f;--bg2:#26242b;--tag:#f3ead8;--tag-edge:#e6d9bf;
  --ink:#2b2118;--pink:#e8447a;--yellow:#f2b705;--green:#4c9a6a;
  --blue:#4a7cc4;--purple:#8b5cf6;--orange:#f97316;
  --muted:#8a8390;--muted2:#bdb6c2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{background:radial-gradient(circle at 20% 0%,#2a2730 0%,var(--bg) 55%);
  color:var(--muted2);font-family:'Zen Maru Gothic',sans-serif;
  overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;display:flex;flex-direction:column;min-height:100vh;}
.wrap{max-width:480px;margin:0 auto;width:100%;
  padding:max(env(safe-area-inset-top),18px) 18px max(env(safe-area-inset-bottom),10px);
  flex:1;display:flex;flex-direction:column;}
header{padding-bottom:10px;}
.title-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
.title-th{font-family:'Sarabun',sans-serif;font-weight:600;font-size:22px;color:#fff;}
.title-sub{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.mode-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;}
.mode-tabs::-webkit-scrollbar{display:none;}
.mode-tab{flex:0 0 auto;padding:7px 13px;border-radius:14px;font-size:12px;font-weight:700;
  border:1.5px solid transparent;background:var(--bg2);color:var(--muted2);cursor:pointer;
  transition:transform .12s,background .18s;}
.mode-tab:active{transform:scale(.95);}
.mode-tab[data-mode="vocab"].active{background:var(--yellow);color:#2b2118;border-color:var(--yellow);}
.mode-tab[data-mode="conversation"].active{background:var(--pink);color:#fff;border-color:var(--pink);}
.mode-tab[data-mode="grammar"].active{background:var(--green);color:#fff;border-color:var(--green);}
.mode-tab[data-mode="font"].active{background:var(--blue);color:#fff;border-color:var(--blue);}
.mode-tab[data-mode="numbers"].active{background:var(--purple);color:#fff;border-color:var(--purple);}
.mode-tab[data-mode="thaienglish"].active{background:var(--orange);color:#fff;border-color:var(--orange);}
.sub-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;min-height:28px;}
.sub-row::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;padding:5px 12px;border-radius:999px;font-size:11px;
  font-family:'IBM Plex Mono',monospace;background:var(--bg2);
  border:1px solid #38353f;color:var(--muted2);cursor:pointer;}
.chip.active-vocab{background:var(--yellow);color:#2b2118;border-color:var(--yellow);}
.chip.active-conv{background:var(--pink);color:#fff;border-color:var(--pink);}
.chip.active-font{background:var(--blue);color:#fff;border-color:var(--blue);}
.settings-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;min-height:28px;}
.pill{background:var(--bg2);border:1px solid #38353f;color:var(--muted2);
  border-radius:999px;padding:5px 11px;font-size:11.5px;
  font-family:'IBM Plex Mono',monospace;cursor:pointer;}
.pill.on{background:#3a3742;color:#fff;border-color:#55505f;}
.progress-line{display:flex;justify-content:flex-end;margin-top:5px;min-height:16px;}
.progress-text{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
/* ─── CARD ─── */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 14px;}
.flip-wrap{width:100%;max-width:340px;height:390px;perspective:1400px;}
.card-inner{position:relative;width:100%;height:100%;
  transition:transform .45s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-inner.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--tag);border-radius:18px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 18px 30px -14px rgba(0,0,0,.55);border:1px solid var(--tag-edge);
  display:flex;flex-direction:column;padding:22px 20px 18px;color:var(--ink);}
.face-back{transform:rotateY(180deg);overflow-y:auto;}
.ribbon{position:absolute;top:14px;right:-1px;font-family:'IBM Plex Mono',monospace;
  font-size:10px;font-weight:500;color:#fff;padding:3px 10px 3px 12px;border-radius:6px 0 0 6px;}
.hole{width:16px;height:16px;border-radius:50%;background:var(--bg);
  border:3px solid var(--tag-edge);position:absolute;top:14px;left:14px;}
.lv{position:absolute;bottom:14px;right:14px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9c8d68;}
.face-front{justify-content:center;align-items:center;text-align:center;}
.th-big{font-family:'Sarabun',sans-serif;font-weight:500;font-size:38px;line-height:1.4;margin-top:16px;}
.th-big.sm{font-size:24px;}
.jp-big{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:22px;line-height:1.45;margin-top:16px;}
.ro-front{font-family:'IBM Plex Mono',monospace;font-size:14px;color:#6b5c3e;margin-top:8px;}
.tap-hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:#9c8d68;font-family:'IBM Plex Mono',monospace;}
.audio-btn{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--tag);
  border:none;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.audio-btn:active{transform:scale(.9);}
.front-audio{margin-top:16px;}
.scene-tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8a7a55;margin-top:26px;margin-bottom:2px;}
/* back face content */
.back-ro{font-family:'IBM Plex Mono',monospace;font-size:14px;color:#6b5c3e;margin-top:28px;}
.back-jp{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:19px;margin-top:10px;line-height:1.5;}
.gram-title{font-family:'Sarabun',sans-serif;font-weight:600;font-size:18px;margin-top:26px;color:var(--ink);}
.ex-ok-btn{border:1.5px solid #4caf50;background:transparent;color:#4caf50;
  border-radius:999px;padding:5px 12px;font-size:11px;font-weight:700;
  font-family:'Zen Maru Gothic',sans-serif;cursor:pointer;white-space:nowrap;}
.ex-ok-btn.done{background:#4caf50;color:#fff;}
.hole-checked{background:#4caf50 !important;}
.gram-explain{font-size:13.5px;line-height:1.7;margin-top:8px;}
.ex-box{margin-top:12px;background:rgba(0,0,0,.06);border-radius:10px;padding:10px 12px;}
.ex-th{font-family:'Sarabun',sans-serif;font-weight:500;font-size:18px;}
.ex-ro{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6b5c3e;margin-top:3px;}
.ex-jp{font-size:13px;margin-top:3px;}
.back-actions{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:10px;}
.learn-btn{border:1.5px solid var(--ink);background:transparent;color:var(--ink);
  border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;
  font-family:'Zen Maru Gothic',sans-serif;cursor:pointer;}
.learn-btn.done{background:var(--ink);color:var(--tag);}
/* ─── NAV ─── */
.nav-row{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px;}
.nav-btn{width:46px;height:46px;border-radius:50%;background:var(--bg2);
  border:1px solid #38353f;color:#fff;font-size:18px;cursor:pointer;}
.nav-btn:active{transform:scale(.9);}
.dot-count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);min-width:60px;text-align:center;}
/* ─── STATIC ─── */
.static-page{flex:1;overflow-y:auto;padding:4px 0 16px;}
.sec-title{font-size:12px;font-weight:700;color:var(--muted2);margin:14px 0 8px;letter-spacing:.5px;text-transform:uppercase;}
/* font table */
.font-table{width:100%;border-collapse:collapse;font-size:14px;}
.font-table th{background:#2e2b35;color:var(--muted2);padding:7px 8px;font-size:11px;font-family:'IBM Plex Mono',monospace;font-weight:500;text-align:left;}
.font-table td{padding:8px 8px;border-bottom:1px solid #2e2b35;vertical-align:middle;}
.font-table tr:nth-child(even) td{background:rgba(255,255,255,.025);}
.ft-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
.ft-std{font-family:'Sarabun',sans-serif;font-size:24px;}
.ft-chakra{font-family:'Chakra Petch',sans-serif;font-size:24px;}
.ft-sriracha{font-family:'Sriracha',cursive;font-size:24px;}
.ft-cell-std{background:var(--tag);border-radius:8px;padding:4px 10px;display:inline-block;color:#2b2118;}
.ft-cell-t{background:#f0ebe0;border-radius:8px;padding:4px 10px;display:inline-block;color:#2b2118;}
.ft-cell-s{background:#fff8ee;border-radius:8px;padding:4px 10px;display:inline-block;color:#2b2118;}
/* numbers grid */
.num-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px;}
.num-card{background:var(--bg2);border:1px solid #38353f;border-radius:14px;padding:12px 14px;cursor:pointer;
  display:flex;align-items:center;gap:12px;transition:transform .12s;}
.num-card:active{transform:scale(.96);}
.num-th-big{font-family:'Sarabun',sans-serif;font-size:30px;color:#fff;line-height:1;}
.num-info{flex:1;}
.num-arabic{font-family:'IBM Plex Mono',monospace;font-size:17px;color:var(--yellow);}
.num-ro{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-top:3px;}
.num-th-word{font-family:'Sarabun',sans-serif;font-size:15px;color:var(--muted2);margin-top:2px;}
.num-spk{font-size:16px;color:var(--muted);}
footer{text-align:center;padding:6px 0 2px;}
.reset-btn{font-size:11px;color:var(--muted);background:none;border:none;text-decoration:underline;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;}
.audio-note{font-size:10px;color:#5e5968;margin-top:6px;line-height:1.6;}
@media(max-height:700px){.flip-wrap{height:355px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <div><div class="title-th">ป้ายไทย</div><div class="title-sub">TAKA's Thai pocket cards</div></div>
    </div>
    <div class="mode-tabs">
      <div class="mode-tab" data-mode="vocab">単語</div>
      <div class="mode-tab" data-mode="conversation">会話</div>
      <div class="mode-tab" data-mode="grammar">文法</div>
      <div class="mode-tab" data-mode="font">タイ文字</div>
      <div class="mode-tab" data-mode="numbers">数字</div>
    </div>
    <div class="sub-row" id="subRow"></div>
    <div class="settings-row" id="settingsRow"></div>
    <div class="progress-line"><span class="progress-text" id="progressText"></span></div>
  </header>

  <div class="stage" id="cardStage">
    <div class="flip-wrap" id="flipWrap">
      <div class="card-inner" id="cardInner">
        <div class="face face-front" id="faceFront"></div>
        <div class="face face-back" id="faceBack"></div>
      </div>
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prevBtn">&#8249;</button>
      <span class="dot-count" id="dotCount">1 / 1</span>
      <button class="nav-btn" id="nextBtn">&#8250;</button>
    </div>
  </div>

  <div class="static-page" id="staticPage" style="display:none;"></div>

  <footer>
    <button class="reset-btn" id="resetBtn">この分類の学習記録をリセット</button>
    <div style="margin-top:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
      <button class="reset-btn" id="exportBtn" style="color:#4a7cc4;">📤 データをエクスポート</button>
      <button class="reset-btn" id="importBtn" style="color:#4c9a6a;">📥 データをインポート</button>
    </div>
    <div class="audio-note">🔊 音声が出ない場合は 設定 › アクセシビリティ › 読み上げコンテンツ › 音声 → タイ語を追加</div>
  </footer>
</div>

// ── 例文生成ロジック v4 ────────────────────────────────────────────
// 単語の日本語訳のキーワードで文型を精密に選択

function buildExampleStatic(item, pos) {
  // 固定例文があれば優先して返す（性別語尾を適用）
  if(FIXED_EX[item.id]){
    const fe = FIXED_EX[item.id];
    const ptTh = PT[st.gender].th;
    const ptRo = PT[st.gender].ro;
    // 末尾の ครับ/ค่ะ を性別設定に合わせて置換
    const feTh = fe.th.replace(/ครับ$|ค่ะ$/, ptTh);
    const feRo = fe.ro.replace(/khráp$|khâ$/, ptRo);
    return {th: feTh, ro: feRo, jp: fe.jp};
  }
  const ptTh = PT[st.gender].th;
  const ptRo = PT[st.gender].ro;
  const w  = item.th;
  const r  = item.ro;
  const jp = item.jp.split('、')[0].split('/')[0].split('・')[0].trim();
  const idNum = parseInt((item.id || '0').replace(/\D/g,'')) || 0;

  // ── 名詞 ──────────────────────────────────────────────────────
  if(pos === 'noun'){
    // カテゴリ判定（タイ語単語で判定）
    const t = w;

    // 1. 場所・施設 → 「〜はどこですか」「〜に行きたいです」
    if(/โรง|สถาน|สนาม|ตลาด|ร้าน|ห้อง|สวน|ทาง|ท่า|ถนน|ซอย|เยาวราช|สุขุมวิท/.test(t))
      return {th:`${w}อยู่ที่ไหน${ptTh}`,ro:`${r} yùu thîi nǎi ${ptRo}`,jp:`${jp}はどこですか`};

    // 2. 乗り物 → 「〜で行きます」
    if(/รถ|เรือ|เครื่องบิน|รถไฟ|รถเมล์|รถบัส|รถมอ/.test(t))
      return {th:`ผมมาด้วย${w}${ptTh}`,ro:`phǒm maa dûai ${r} ${ptRo}`,jp:`${jp}で来ました`};

    // 3. 食べ物・飲み物 → 「〜をひとつください」「〜はおいしい」
    if(/อาหาร|ข้าว|น้ำ|กาแฟ|ชา|เบียร์|ขนม|แกง|ผัด|ต้ม|ไข่|ผัก|เนื้อ|ปลา|กุ้ง|หอย|ปู|ผล/.test(t)){
      const fp = [
        {th:`${w}อร่อยมาก${ptTh}`,ro:`${r} aròi mâak ${ptRo}`,jp:`${jp}はとてもおいしいです`},
        {th:`ขอ${w}หนึ่งที่${ptTh}`,ro:`khɔ̌ɔ ${r} nɯɯng thîi ${ptRo}`,jp:`${jp}をひとつください`},
        {th:`${w}เผ็ดเกินไปสำหรับผม${ptTh}`,ro:`${r} phèt kɤɤn pai sǎmràp phǒm ${ptRo}`,jp:`${jp}は私には辛すぎます`},
        {th:`${w}กินได้ที่ไหนครับ`,ro:`${r} kin dâai thîi nǎi khráp`,jp:`${jp}はどこで食べられますか`},
        {th:`${w}อร่อยไหม${ptTh}`,ro:`${r} aròi mǎi ${ptRo}`,jp:`${jp}はおいしいですか`},
      ];
      return fp[idNum % fp.length];
    }

    // 4. 身体部位 → 「〜が痛いです」
    if(/^(หัว|ท้อง|ตา|หู|จมูก|ปาก|ฟัน|คอ|แขน|ขา|เท้า|มือ|หลัง|อก|เอว|ไหล่|เข่า|ลิ้น|แก้ม|คาง|คิ้ว|หน้าอก|นิ้ว|ข้อเท้า|ไหล่|หน้าผาก|ต้นขา|สะโพก)/.test(t)){
      const bodyPats = [
        {th:`ปวด${w}${ptTh}`,ro:`pùat ${r} ${ptRo}`,jp:`${jp}が痛いです`},
        {th:`${w}ของคุณสวยมาก${ptTh}`,ro:`${r} khɔ̌ɔng khun sǔai mâak ${ptRo}`,jp:`あなたの${jp}はとてもきれいですね`},
        {th:`${w}ของเธอยาวมาก${ptTh}`,ro:`${r} khɔ̌ɔng thɤɤ yaao mâak ${ptRo}`,jp:`彼女の${jp}はとても長いですね`},
        {th:`ปวด${w}มากเลย${ptTh}`,ro:`pùat ${r} mâak lɤɤi ${ptRo}`,jp:`${jp}がひどく痛いです`},
        {th:`${w}ของผมไม่ค่อยดี${ptTh}`,ro:`${r} khɔ̌ɔng phǒm mâi khɔ̂i dii ${ptRo}`,jp:`私の${jp}は調子が良くないです`},
      ];
      return bodyPats[idNum % bodyPats.length];
    }

    // 5. 家族・人称 → 「私の〜は元気です」
    if(/แม่|พ่อ|พี่|น้อง|ลูก|สามี|ภรรยา|ยาย|ตา|ปู่|ย่า|ลุง|น้า|ป้า/.test(t))
      return {th:`${w}ของผมสบายดี${ptTh}`,ro:`${r} khɔ̌ɔng phǒm sàbaai dii ${ptRo}`,jp:`私の${jp}は元気です`};

    // 6. 職業・人 → 「その〜は親切です」
    if(/หมอ|พยาบาล|ครู|อาจารย์|ตำรวจ|ทหาร|นัก|คน/.test(t))
      return {th:`${w}นั้นใจดีมาก${ptTh}`,ro:`${r} nán cai dii mâak ${ptRo}`,jp:`あの${jp}はとても親切です`};

    // 7. 道具・文具 → 「〜はありますか」
    if(/ดินสอ|ปากกา|สมุด|หนังสือ|ไม้|กระดาษ|กระเป๋า|แว่น|เครื่อง|โทร|คอม|มือถือ|ทีวี/.test(t))
      return {th:`มี${w}ไหม${ptTh}`,ro:`mii ${r} mǎi ${ptRo}`,jp:`${jp}はありますか`};

    // 8. 時間・時期 → 「〜は何時ですか」「〜は楽しかった」
    if(/วัน|เดือน|ปี|ชั่วโมง|นาที|วินาที|เช้า|เย็น|กลาง|คืน|ตอน|อาทิตย์/.test(t))
      return {th:`${w}นี้อากาศดีมาก${ptTh}`,ro:`${r} níi aakàat dii mâak ${ptRo}`,jp:`この${jp}は天気がとても良いです`};

    // 9. お金・価格 → 「〜はいくらですか」
    if(/ราคา|เงิน|บาท|ค่า|ตั๋ว/.test(t))
      return {th:`${w}เท่าไหร่${ptTh}`,ro:`${r} thâo rài ${ptRo}`,jp:`${jp}はいくらですか`};

    // 10. 言語・言葉 → 「〜を勉強しています」
    if(/ภาษา|คำ|ความ|ประโยค/.test(t))
      return {th:`ผมกำลังเรียน${w}${ptTh}`,ro:`phǒm kamlang riian ${r} ${ptRo}`,jp:`${jp}を勉強しています`};

    // 11. 汎用（残り全部） → 複数パターンからID番号で選択
    const generic = [
      {th:`มี${w}ไหม${ptTh}`,ro:`mii ${r} mǎi ${ptRo}`,jp:`${jp}はありますか`},
      {th:`${w}นี้ดีมาก${ptTh}`,ro:`${r} níi dii mâak ${ptRo}`,jp:`この${jp}はとても良いです`},
      {th:`ขอ${w}ได้ไหม${ptTh}`,ro:`khɔ̌ɔ ${r} dâai mǎi ${ptRo}`,jp:`${jp}をいただけますか`},
      {th:`ผมชอบ${w}${ptTh}`,ro:`phǒm chɔ̂ɔp ${r} ${ptRo}`,jp:`私は${jp}が好きです`},
      {th:`${w}อยู่ที่ไหน${ptTh}`,ro:`${r} yùu thîi nǎi ${ptRo}`,jp:`${jp}はどこですか`},
    ];
    return generic[idNum % generic.length];
  }

  // ── 動詞 ──────────────────────────────────────────────────────
  if(pos === 'verb'){
    // 動詞のjpから活用幹を作る
    const vj = jp;
    const isRu = vj.endsWith('る');
    const isKu = vj.endsWith('く');
    const isSuru = vj.endsWith('する');
    const isU  = vj.endsWith('う') || vj.endsWith('ぶ') || vj.endsWith('む');

    const vte = isSuru ? vj.slice(0,-2)+'して' :
                isRu   ? vj.slice(0,-1)+'て' :
                isKu   ? vj.slice(0,-1)+'いて' :
                isU    ? vj.slice(0,-1)+'って' : vj+'て';
    const vmasu = isSuru ? vj.slice(0,-2)+'します' :
                  isRu   ? vj.slice(0,-1)+'ます' :
                  isKu   ? vj.slice(0,-1)+'きます' :
                  isU    ? vj.slice(0,-1)+'います' : vj+'ます';
    const vtai = isSuru ? vj.slice(0,-2)+'したいです' :
                 isRu   ? vj.slice(0,-1)+'たいです' :
                 isKu   ? vj.slice(0,-1)+'きたいです' :
                 isU    ? vj.slice(0,-1)+'いたいです' : vj+'たいです';
    const vdeki = isSuru ? vj.slice(0,-2)+'できますか' :
                  isRu   ? vj.slice(0,-1)+'られますか' :
                  isKu   ? vj.slice(0,-1)+'けますか' : vj+'できますか';

    const patterns = [
      {th:`ผมอยาก${w}${ptTh}`,ro:`phǒm yàak ${r} ${ptRo}`,jp:vtai},
      {th:`${w}ได้ไหม${ptTh}`,ro:`${r} dâai mǎi ${ptRo}`,jp:vdeki},
      {th:`ผม${w}ทุกวัน${ptTh}`,ro:`phǒm ${r} thúk wan ${ptRo}`,jp:`私は毎日${vmasu}`},
      {th:`ช่วย${w}ให้หน่อย${ptTh}`,ro:`chûai ${r} hâi nɔ̀i ${ptRo}`,jp:`${vte}もらえますか`},
      {th:`กำลัง${w}อยู่${ptTh}`,ro:`kamlang ${r} yùu ${ptRo}`,jp:`今${vte}いるところです`},
    ];
    return patterns[idNum % patterns.length];
  }

  // ── 形容詞 ──────────────────────────────────────────────────────
  if(pos === 'adj'){
    // 感情・状態系（〜に感じます）
    if(/い$|な$/.test(jp) || /สบาย|เหนื่อย|ยุ่ง|ดีใจ|เศร้า|กลัว|โกรธ|ง่วง/.test(w))
      (()=>{
      const ajp = jp;
      const ajpFeel = ajp.endsWith('い') ? ajp.slice(0,-1)+'く感じます' :
                      ajp.endsWith('な') ? ajp.slice(0,-1)+'に感じます' :
                      ajp.endsWith('的') ? ajp+'に感じます' :
                      ajp+'です';
      return {th:`วันนี้รู้สึก${w}${ptTh}`,ro:`wan níi rúu sɯ̀k ${r} ${ptRo}`,jp:`今日は${ajpFeel}`};
    })()
    // 食べ物系
    if(/ร้อน|เย็น|อร่อย|เผ็ด|หวาน|เค็ม|ขม|เปรี้ยว/.test(w))
      return {th:`อาหารนี้${w}มาก${ptTh}`,ro:`aahǎan níi ${r} mâak ${ptRo}`,jp:`この料理はとても${jp}です`};
    // 大きさ・程度系
    const ap=[
      {th:`วันนี้${w}มาก${ptTh}`,ro:`wan níi ${r} mâak ${ptRo}`,jp:(()=>{const j=jp;return'今日はとても'+(j.endsWith('な')?j.slice(0,-1)+'です':j.endsWith('い')?j.replace(/い$/,'いです'):j+'です');})()},
      {th:`ที่นี่${w}กว่าที่บ้าน${ptTh}`,ro:`thîi níi ${r} kwàa thîi bâan ${ptRo}`,jp:(()=>{const j=jp;return'ここは家よりも'+(j.endsWith('な')?j.slice(0,-1)+'です':j.endsWith('い')?j.replace(/い$/,'いです'):j+'です');})()},
      {th:`ไม่ค่อย${w}เลย${ptTh}`,ro:`mâi khɔ̀i ${r} lɯɯi ${ptRo}`,jp:`あまり${jp}くないです`},
    ];
    return ap[idNum % ap.length];
  }

  // ── 副詞 ──────────────────────────────────────────────────────
  if(pos === 'adv'){
    const dp=[
      {th:`${w}ทำงานครับ`,ro:`${r} tham ngaan khráp`,jp:`${jp}働きます`},
      {th:`พูด${w}หน่อยได้ไหม${ptTh}`,ro:`phuut ${r} nɔ̀i dâai mǎi ${ptRo}`,jp:`${jp}話してもらえますか`},
    ];
    return dp[idNum % dp.length];
  }

  // ── 類別詞 ──────────────────────────────────────────────────────
  if(pos === 'classifier')
    return {th:`ขอสอง${w}${ptTh}`,ro:`khɔ̌ɔ sɔɔng ${r} ${ptRo}`,jp:`2${jp}ください`};

  // ── 疑問詞 ──────────────────────────────────────────────────────
  if(pos === 'question')
    return {th:`นั่น${w}${ptTh}`,ro:`nân ${r} ${ptRo}`,jp:`あれは${jp}ですか`};

  // ── 挨拶 ──────────────────────────────────────────────────────
  return {th:`${w}${ptTh}`,ro:`${r} ${ptRo}`,jp:jp};
}

function speak(text){
  try{
    const syn=window.speechSynthesis; if(!syn||!text) return;
    syn.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='th-TH'; u.rate=0.85;
    const v=(syn.getVoices()||[]).find(v=>v.lang&&v.lang.toLowerCase().startsWith('th'));
    if(v) u.voice=v;
    syn.speak(u);
  }catch(e){}
}

function list(){
  if(st.mode==='vocab'){
    let l=DATA[st.pos]||[];
    if(st.filterUn){ const f=l.filter(i=>!st.learned[st.pos].has(i.id)); if(f.length) l=f; }
    if(st.filterUnEx){ const f2=l.filter(i=>!exChecked.has(i.id)); if(f2.length) l=f2; }
    return l;
  }
  if(st.mode==='conversation'){
    let l=st.scene==='すべて'?CONV:CONV.filter(i=>i.scene===st.scene);
    if(st.filterUn){ const f=l.filter(i=>!st.learned.conversation.has(i.id)); if(f.length) l=f; }
    return l;
  }
  if(st.mode==='grammar') return GRAM;
  return [];
}
function lkKey(){
  if(st.mode==='vocab') return st.pos;
  if(st.mode==='conversation') return 'conversation';
  if(st.mode==='grammar') return 'grammar';
}

function renderSub(){
  const sr=document.getElementById('subRow');
  if(st.mode==='vocab'){
    sr.style.display='flex';
    sr.innerHTML=Object.entries(POS_LABELS).map(([k,v])=>
      `<button class="chip ${k===st.pos?'active-vocab':''}" data-pos="${k}">${v}</button>`).join('');
    sr.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{st.pos=c.dataset.pos;st.idx=0;st.flipped=false;render();}));
  } else if(st.mode==='conversation'){
    sr.style.display='flex';
    sr.innerHTML=SCENES.map(s=>
      `<button class="chip ${s===st.scene?'active-conv':''}" data-sc="${s}">${s}</button>`).join('');
    sr.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{st.scene=c.dataset.sc;st.idx=0;st.flipped=false;render();}));
  } else if(st.mode==='font'){
    sr.style.display='flex';
    const tabs=[['compare','比較'],['mid','中子音'],['high','高子音'],['low','低子音'],['tone','声調'],['vowel','母音']];
    sr.innerHTML=tabs.map(([k,v])=>
      `<button class="chip ${k===st.fontTab?'active-font':''}" data-ft="${k}">${v}</button>`).join('');
    sr.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{st.fontTab=c.dataset.ft;render();}));
  } else { sr.style.display='none'; sr.innerHTML=''; }
}

function renderSettings(){
  const sr=document.getElementById('settingsRow');
  const noCtrl=['font','numbers'].includes(st.mode);
  if(noCtrl){ sr.innerHTML=''; return; }
  const noDir=['grammar'].includes(st.mode);
  let h='';
  if(!noDir) h+=`<button class="pill" id="dirPill">出題: ${st.dir==='th-jp'?'TH→JP':'JP→TH'}</button>`;
  h+=`<button class="pill ${st.level==='beginner'?'on':''}" id="lvPill">${st.level==='beginner'?'初心者':'中級者+'}</button>`;
  h+=`<button class="pill on" id="gdPill">${st.gender==='male'?'♂ 男性':'♀ 女性'}</button>`;
  if(st.mode!=='grammar') h+=`<button class="pill ${st.filterUn?'on':''}" id="unPill">未学習だけ</button>`;
  if(st.mode==='vocab') h+=`<button class="pill ${st.filterUnEx?'on':''}" id="unExPill">例文未確認</button>`;
  sr.innerHTML=h;
  const dp=document.getElementById('dirPill'); if(dp) dp.onclick=()=>{st.dir=st.dir==='th-jp'?'jp-th':'th-jp';st.flipped=false;render();};
  const lp=document.getElementById('lvPill'); if(lp) lp.onclick=()=>{st.level=st.level==='beginner'?'intermediate':'beginner';sto_set('s:level',st.level);render();};
  const gp=document.getElementById('gdPill'); if(gp) gp.onclick=()=>{st.gender=st.gender==='male'?'female':'male';sto_set('s:gender',st.gender);render();};
  const up=document.getElementById('unPill'); if(up) up.onclick=()=>{st.filterUn=!st.filterUn;st.idx=0;st.flipped=false;render();};
  const uep=document.getElementById('unExPill'); if(uep) uep.onclick=()=>{st.filterUnEx=!st.filterUnEx;st.idx=0;st.flipped=false;render();};
}

      const exBg     = isRare ? '#e0d9ce' : '#ede4cc';

      h += '<div style="background:'+cardBg+';border-radius:14px;border:1px solid '+cardBord+';overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.22);">';

      h += '<div style="display:flex;align-items:center;padding:10px 10px 7px;gap:6px;">';

      h += '</div>';
      h += '</div>';
      h += '</div>';

      // ── 中段：母音名 ──────────────────────────────────────────
      if(!isRare){
        h += '<div style="padding:3px 10px 5px;border-top:1px solid rgba(0,0,0,.06);">';
        h += '<div style="font-family:\'Sarabun\',sans-serif;font-size:13px;color:#2b2118;font-weight:500;">'+v.name_th+'</div>';

      } else {
        h += '<div style="padding:3px 10px 5px;border-top:1px solid rgba(0,0,0,.06);">';

      }

      // ── 下段：例単語 ＋ 🔊（例単語音声のみ） ──────────────────
      h += '<div style="background:'+exBg+';padding:7px 10px;display:flex;align-items:center;gap:6px;">';
      if(isRare){

        h += '</div>';
      } else {
        h += '<div style="flex:1;min-width:0;">';
        h += '<div style="font-size:9px;color:#8a7a55;font-family:\'IBM Plex Mono\',monospace;margin-bottom:1px;">例単語</div>';
        h += '<div style="display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;">';
        h += '<span style="font-family:\'Sarabun\',sans-serif;font-size:20px;color:#2b2118;font-weight:500;">'+v.ex+'</span>';
        h += '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:9.5px;color:#6b5c3e;">'+v.ex_ro+'</span>';
        h += '</div>';
        h += '<div style="font-size:10.5px;color:#4a3d2a;margin-top:1px;">'+v.ex_jp+'</div>';
        h += '</div>';
        h += '<button onclick="event.stopPropagation();speak(\''+v.ex+'\')" style="width:34px;height:34px;border-radius:50%;background:#2b2118;border:none;color:#f3ead8;font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;">🔊</button>';

      h += '</div>'; // card
    });

    h += '</div>'; // grid

  // ── マイムアン20単語 ─────────────────────────────────────────
  h += '<div style="margin:12px 0 8px;padding:5px 10px;background:#c0392b;color:#fff;border-radius:8px;font-size:13px;font-weight:700;">⚠️ ใ（マイムアン）を使う単語 — 暗記必須！</div>';

  h += '<div style="font-size:11px;color:#c0392b;margin-bottom:8px;">ไ と ใ は同じ「ai」音。ใ を使う単語は20単語のみ。丸ごと覚える！</div>';
  h += '<div style="display:flex;flex-wrap:wrap;gap:5px;">';
  MAI_MUAN.forEach(function(w){
    var isAncient = !w.spk;
    var bord = isAncient ? '1px dashed #e0b0b0' : '1px solid #f5c6cb';

    h += '<div style="border:'+bord+';border-radius:6px;padding:4px 8px;background:'+bg+';display:flex;align-items:center;gap:5px;">';
    h += '<span style="font-family:\'Sarabun\',sans-serif;font-size:20px;color:'+(isAncient?'#bbb':'#2b2118')+';">'+w.th+'</span>';
    h += '<span style="font-size:10px;color:'+(isAncient?'#bbb':'#888')+';">'+w.jp+'</span>';
    if(w.spk){
      h += '<button onclick="event.stopPropagation();speak(\''+w.th+'\')" style="width:26px;height:26px;border-radius:50%;background:#c0392b;border:none;color:#fff;font-size:11px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;">🔊</button>';
    }
    h += '</div>';
  });
  h += '</div></div>';

  h += '</div>';
  return h;
}

    ['\u0e27','W','w\u0254\u0254 w\u025b\u030c\u025bn','\u0e41\u0e2b\u0e27\u0e19','\u0e27\u0e2d\u0e41\u0e2b\u0e27\u0e19'],
    ['\u0e2c','L','l\u0254\u0254 cu-laa','\u0e08\u0e38\u0e2c\u0e32','\u0e2c\u0e2d\u0e08\u0e38\u0e2c\u0e32'],
  ];
  const cfg={
    mid:{data:MID,color:'#c0392b',bg:'rgba(192,57,43,.15)',label:'中子音　9文字',split:-1},
    high:{data:HIGH,color:'#4c9a6a',bg:'rgba(76,154,106,.15)',label:'高子音　10文字（廃字1含む）',split:-1},
    low:{data:[...LOW_P,...LOW_S],color:'#4a7cc4',bg:'rgba(74,124,196,.15)',label:'低子音　24文字（廃字1含む）',split:LOW_P.length},
  }[cls];
  const rows=cfg.data;
  let html=`<div style="text-align:center;font-size:18px;font-weight:700;color:${cfg.color};margin:8px 0 10px;">${cfg.label}</div>
<div style="background:${cfg.bg};border-radius:14px;overflow:hidden;">
<table style="width:100%;border-collapse:collapse;">
<tr style="border-bottom:1px solid rgba(255,255,255,.1);">
  <th style="padding:8px 10px;font-size:11px;color:rgba(255,255,255,.4);text-align:left;font-family:monospace;">子音</th>
  <th style="padding:8px 10px;font-size:11px;color:rgba(255,255,255,.4);text-align:left;font-family:monospace;">アルファ</th>

  <th></th>
</tr>`;
  rows.forEach(([ch,letter,name,kw,thaiName],i)=>{
    const sep=(cls==='low'&&i===cfg.split)?`<tr><td colspan="4" style="padding:5px 10px;background:rgba(0,0,0,.25);font-size:10px;color:rgba(255,255,255,.35);font-family:monospace;">▼ 単独字（対応高子音なし）</td></tr>`:'';
    html+=sep+`<tr style="border-bottom:1px solid rgba(255,255,255,.06)">
  <td style="padding:10px 10px;"><span style="font-family:'Sarabun',sans-serif;font-size:34px;color:${cfg.color};font-weight:600;line-height:1;">${ch}</span></td>
  <td style="padding:10px 6px;font-family:monospace;font-size:18px;color:#fff;font-weight:700;">${letter}</td>

  <td style="padding:10px 8px;text-align:right;"><button onclick="event.stopPropagation();speak('${thaiName}')" style="background:rgba(255,255,255,.1);border:none;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;color:rgba(255,255,255,.7);">&#128266;</button></td>
</tr>`;
  });
  html+=`</table></div>`;
  return html;
}

function render(){
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===st.mode));
  renderSub();
  renderSettings();

  const isStatic=['font','numbers'].includes(st.mode);
  document.getElementById('cardStage').style.display=isStatic?'none':'flex';
  document.getElementById('resetBtn').style.display=isStatic?'none':'inline';
  const sp=document.getElementById('staticPage');
  if(isStatic){
    sp.style.display='block';
    sp.innerHTML=st.mode==='font'?renderFont():renderNumbers();
    return;
  }
  sp.style.display='none';

  const l=list();
  if(st.idx>=l.length) st.idx=0;
  const item=l[st.idx]||l[0];
  if(!item) return;
  const lk=lkKey();
  const lset=st.learned[lk];
  const isLearned=lset.has(item.id);
  const beg=st.level==='beginner';
  const modeRibbon={vocab:{cls:'vocab',lbl:POS_LABELS[st.pos]},
    conversation:{cls:'conv',lbl:'会話'},grammar:{cls:'gram',lbl:'文法'},
    thaienglish:{cls:'te',lbl:'タイ英語'}}[st.mode]||{cls:'vocab',lbl:''};
  const rib=(cls,lbl)=>`<span class="ribbon" style="background:${
    {vocab:'var(--yellow)',conv:'var(--pink)',gram:'var(--green)',te:'var(--orange)'}[cls]||'var(--yellow)'
    };color:${cls==='vocab'?'#2b2118':'#fff'}">${lbl}</span>`;

  const ribHtml=rib(modeRibbon.cls, modeRibbon.lbl);
  const hole=`<span class="hole${(st.mode==='vocab'&&item&&exChecked.has(item.id))?' hole-checked':''}"></span>`;

  let front='', back='', spk='';

  if(st.mode==='grammar'){
    spk=fTH(item.ex_th);
    front=`${ribHtml}${hole}<div class="th-big sm" style="margin-top:30px;">${item.title}</div>
      <div class="tap-hint">タップして解説・例文を見る</div>`;
    back=`${ribHtml}${hole}<div class="gram-title">${item.title}</div>
      <div class="gram-explain">${item.explain}</div>
      <div class="ex-box">
        <div class="ex-th">${fTH(item.ex_th)}</div>
        ${beg?`<div class="ex-ro">${fRO(item.ex_ro)}</div>`:''}
        <div class="ex-jp">${item.ex_jp}</div>
      </div>
      <div class="back-actions">
        <button class="audio-btn" id="audB">🔊</button>
        <button class="learn-btn ${isLearned?'done':''}" id="lrnB">${isLearned?'覚えた ✓':'覚えた'}</button>
      </div>`;
  } else if(st.mode==='conversation'){
    const thT=fTH(item.th); const roT=fRO(item.ro);
    spk=thT;
    const sc=`<div class="scene-tag">${item.scene}</div>`;
    if(st.dir==='th-jp'){
      front=`${ribHtml}${hole}${sc}<div class="th-big sm">${thT}</div>
        ${beg?`<div class="ro-front">${roT}</div>`:''}
        <button class="audio-btn front-audio" id="audF">🔊</button>
        <div class="tap-hint">タップして意味を見る</div>`;
      back=`${ribHtml}${hole}
        ${beg?`<div class="back-ro" style="margin-top:26px;">${roT}</div>`:''}
        <div class="back-jp" style="${beg?'':'margin-top:40px;'}">${item.jp}</div>
        <div class="back-actions">
          <button class="audio-btn" id="audB">🔊</button>
          <button class="learn-btn ${isLearned?'done':''}" id="lrnB">${isLearned?'覚えた ✓':'覚えた'}</button>
        </div>`;
    } else {
      front=`${ribHtml}${hole}${sc}<div class="jp-big">${item.jp}</div>
        <button class="audio-btn front-audio" id="audF">🔊</button>
        <div class="tap-hint">タップしてタイ語を見る</div>`;
      back=`${ribHtml}${hole}<div class="th-big sm" style="margin-top:24px;">${thT}</div>
        ${beg?`<div class="back-ro">${roT}</div>`:''}
        <div class="back-actions">
          <button class="audio-btn" id="audB">🔊</button>
          <button class="learn-btn ${isLearned?'done':''}" id="lrnB">${isLearned?'覚えた ✓':'覚えた'}</button>
        </div>`;
    }
  } else {
    spk=item.th;
    const lvB=`<span class="lv">${item.level}級</span>`;
    if(st.dir==='th-jp'){
      front=`${ribHtml}${hole}${lvB}<div class="th-big">${item.th}</div>
        ${beg?`<div class="ro-front">${item.ro}</div>`:''}
        <button class="audio-btn front-audio" id="audF">🔊</button>
        <div class="tap-hint">タップして意味を見る</div>`;
      back=`${ribHtml}${hole}${lvB}
        ${beg?`<div class="back-ro">${item.ro}</div>`:''}
        <div class="back-jp" style="${beg?'':'margin-top:38px;'}">${item.jp}</div>
        <div id="exampleBox" style="overflow-y:auto;"></div>
        <div class="back-actions">
          <button class="ex-ok-btn ${exChecked.has(item.id)?'done':''}" id="exOkB">${exChecked.has(item.id)?'例文OK ✓':'例文OK'}</button>
          <button class="learn-btn ${isLearned?'done':''}" id="lrnB">${isLearned?'覚えた ✓':'覚えた'}</button>
        </div>`;
    } else {
      front=`${ribHtml}${hole}${lvB}<div class="jp-big">${item.jp}</div>
        <button class="audio-btn front-audio" id="audF">🔊</button>
        <div class="tap-hint">タップしてタイ語を見る</div>`;
      back=`${ribHtml}${hole}${lvB}<div class="th-big sm" style="margin-top:24px;">${item.th}</div>
        ${beg?`<div class="back-ro">${item.ro}</div>`:''}
        <div id="exampleBox" style="overflow-y:auto;"></div>
        <div class="back-actions">
          <button class="ex-ok-btn ${exChecked.has(item.id)?'done':''}" id="exOkB">${exChecked.has(item.id)?'例文OK ✓':'例文OK'}</button>
          <button class="learn-btn ${isLearned?'done':''}" id="lrnB">${isLearned?'覚えた ✓':'覚えた'}</button>
        </div>`;
    }
  }

  document.getElementById('faceFront').innerHTML=front;
  document.getElementById('faceBack').innerHTML=back;
  document.getElementById('cardInner').classList.toggle('flipped',st.flipped);
  document.getElementById('dotCount').textContent=(st.idx+1)+' / '+l.length;
  document.getElementById('progressText').textContent=lset.size+' 学習済み / 全'+l.length;

  // vocab裏面の音声は例文ボックス内の🔊で対応
  const af=document.getElementById('audF'); if(af) af.onclick=e=>{e.stopPropagation();speak(spk);};
  const lb=document.getElementById('lrnB'); if(lb) lb.onclick=e=>{
    e.stopPropagation();
    if(lset.has(item.id)) lset.delete(item.id); else lset.add(item.id);
    sto_set('l:'+lk,[...lset]); render();
  };
  // 例文OKボタン
  const exOk=document.getElementById('exOkB'); if(exOk) exOk.onclick=e=>{
    e.stopPropagation();
    if(exChecked.has(item.id)) exChecked.delete(item.id); else exChecked.add(item.id);
    saveExChecked(); render();
  };
  // vocab裏面が表示されたとき例文を表示
  if(st.mode==='vocab' && st.flipped && item){
    const exDiv = document.getElementById('exampleBox');
    if(exDiv){
      const ex = buildExampleStatic(item, st.pos);
      exDiv.innerHTML = buildExBox(ex);
      const exSpk = document.getElementById('exSpkBtn');
      if(exSpk) exSpk.onclick = e=>{ e.stopPropagation(); speak(ex.th); };
    }
  }
}

document.getElementById('flipWrap').addEventListener('click',()=>{st.flipped=!st.flipped;render();});
document.getElementById('nextBtn').addEventListener('click',e=>{e.stopPropagation();const l=list();st.idx=(st.idx+1)%l.length;st.flipped=false;render();});
document.getElementById('prevBtn').addEventListener('click',e=>{e.stopPropagation();const l=list();st.idx=(st.idx-1+l.length)%l.length;st.flipped=false;render();});
document.querySelectorAll('.mode-tab').forEach(t=>t.addEventListener('click',()=>{st.mode=t.dataset.mode;st.idx=0;st.flipped=false;render();}));
document.getElementById('resetBtn').addEventListener('click',()=>{
  const k=lkKey(); st.learned[k]=new Set(); sto_set('l:'+k,[]); render();
});

let tx=null;
document.getElementById('flipWrap').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.getElementById('flipWrap').addEventListener('touchend',e=>{
  if(tx===null) return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50){const l=list();st.idx=dx<0?(st.idx+1)%l.length:(st.idx-1+l.length)%l.length;st.flipped=false;render();}
  tx=null;
},{passive:true});

// ─── エクスポート/インポート ────────────────────────────────────
function exportData(){
  const data = {
    exChecked: [...exChecked],
    learned: {},
    level: st.level,
    gender: st.gender,
  };
  for(const k of Object.keys(st.learned)){
    data.learned[k] = [...st.learned[k]];
  }
  const json = JSON.stringify(data);
  // クリップボードにコピー
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(()=>{
      alert('📤 データをクリップボードにコピーしました！\n新しいチャットのアプリで「データをインポート」を押して貼り付けてください。');
    }).catch(()=>{ promptCopy(json); });
  } else { promptCopy(json); }
}
function promptCopy(json){
  const ta = document.createElement('textarea');
  ta.value = json;
  ta.style.cssText='position:fixed;top:0;left:0;width:100%;height:40%;z-index:9999;font-size:12px;padding:8px;';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0,99999);
  const msg = document.createElement('div');
  msg.style.cssText='position:fixed;top:40%;left:0;width:100%;background:#333;color:#fff;text-align:center;padding:12px;z-index:9999;font-size:13px;';
  msg.innerHTML='上のテキストを全選択してコピーしてください<br><button onclick="document.querySelectorAll(\'textarea,div[style*=fixed]\').forEach(e=>e.remove())" style="margin-top:8px;padding:6px 20px;border-radius:20px;border:none;background:#4a7cc4;color:#fff;font-size:13px;">閉じる</button>';
  document.body.appendChild(msg);
}
function importData(){
  const input = prompt('エクスポートしたデータを貼り付けてください:');
  if(!input) return;
  try{
    const data = JSON.parse(input.trim());
    // exChecked
    if(Array.isArray(data.exChecked)){
      data.exChecked.forEach(id=>exChecked.add(id));
      saveExChecked();
    }
    // learned
    if(data.learned){
      for(const k of Object.keys(st.learned)){
        if(Array.isArray(data.learned[k])){
          st.learned[k] = new Set(data.learned[k]);
          sto_set('l:'+k,[...st.learned[k]]);
        }
      }
    }
    // settings
    if(data.level){ st.level=data.level; sto_set('s:level',st.level); }
    if(data.gender){ st.gender=data.gender; sto_set('s:gender',st.gender); }
    alert('✅ インポート完了！\n例文OK: '+exChecked.size+'件');
    render();
  } catch(e){
    alert('❌ データの形式が正しくありません。\nエクスポートしたテキストをそのまま貼り付けてください。');
  }
}

document.getElementById('exportBtn').addEventListener('click', exportData);
document.getElementById('importBtn').addEventListener('click', importData);

if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged=()=>{};
(async()=>{ await loadAll(); render(); })();
