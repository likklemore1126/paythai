<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>7の音声テスト</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;padding:18px 16px 40px;background:#1d1c1b;color:#e8e2d6;font-family:-apple-system,"Hiragino Sans",sans-serif;}
h1{font-size:18px;margin:0 0 6px}
h2{font-size:15px;margin:22px 0 8px;color:#d49a78}
p{font-size:13px;color:#9a948a;line-height:1.7;margin:0 0 12px}
.row{display:grid;grid-template-columns:1fr 70px 70px;gap:8px;align-items:stretch;margin-bottom:8px}
.n{display:flex;flex-direction:column;justify-content:center;font-size:18px;font-weight:600;min-width:0}
.n small{font-weight:400;overflow-wrap:anywhere}
button{padding:12px 6px;border-radius:14px;border:1px solid #3b3935;background:#262523;color:#fff;font-size:14px;font-family:inherit}
button.a{border-color:#7fb08a;color:#bfe3c6}
button:active{opacity:.6}
small{display:block;color:#9a948a;font-size:11px}
.sl{display:flex;align-items:center;gap:10px;font-size:13px}.sl input{flex:1}
#st{font-size:12px;color:#9a948a;margin-top:8px;min-height:1em}
.free{display:grid;grid-template-columns:1fr 70px 70px;gap:8px}
.free input{min-width:0;padding:12px;border-radius:12px;background:#262523;color:#fff;border:1px solid #3b3935;font-size:17px}
#freeTh{font-size:13px;color:#9a948a;margin-top:6px;min-height:1em}
</style></head><body>
<h1>🔊 数字の音声テスト(10回目)</h1>
<p><b>今</b>=今のアプリ(全部iPhoneの声)／<b>A</b>=全部Pixelで録音した音をつないだもの。<br>※録音はテスト用です(本番用は別に用意します)。</p>
<h2>① 言葉と言葉の間</h2>
<div class="sl">詰める<input type="range" id="gap" min="-300" max="200" step="20" value="0">空ける <span id="gapv"></span></div>
<h2>② 聞き比べ</h2>
<div id="list"></div>
<h2>③ 好きな数字で試す(1〜9,999,999)</h2>
<div class="free"><input id="freeN" type="number" inputmode="numeric" value="27500"><button onclick="freePlay(0)">今</button><button class="a" onclick="freePlay(1)">A</button></div>
<div id="freeTh"></div>
<div id="st"></div>
<script>
// アプリの NUMS と thaiNumber と同じ読み方
const DG=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
const UN=[null,'สิบ','ร้อย','พัน','หมื่น','แสน','ล้าน'];
function thaiNumber(n){
  if(n===0) return 'ศูนย์';
  const th=[], str=String(n), L=str.length;
  for(let i=0;i<L;i++){
    const d=+str[i], place=L-1-i; if(d===0) continue;
    if(place===0){ if(d===1 && L>=2 && str[L-2]!=='0') th.push('เอ็ด'); else th.push(DG[d]); }
    else if(place===1){ if(d===1) th.push('สิบ'); else if(d===2) th.push('ยี่สิบ'); else th.push(DG[d]+'สิบ'); }
    else th.push(DG[d]+UN[place]);
  }
  return th.join('');
}
// 録音ファイル(長いものから順に当てはめる)
const CLIP={'ยี่สิบ':'20','ศูนย์':'0','หนึ่ง':'1','สอง':'2','สาม':'3','สี่':'4','ห้า':'5','หก':'6','เจ็ด':'7','แปด':'8','เก้า':'9','สิบ':'10','ยี่':'yi','เอ็ด':'et','ร้อย':'100','พัน':'1000','หมื่น':'10000','แสน':'100000','ล้าน':'1000000'};
const KEYS=Object.keys(CLIP).sort((a,b)=>b.length-a.length);
function tokens(th){const out=[];let s=th;while(s.length){const k=KEYS.find(k=>s.startsWith(k));if(!k) throw new Error('分けられない: '+s);out.push(k);s=s.slice(k.length);}return out;}

const N=[7,17,27,70,77,107,700,777,1700,7000,27500,70000,11,21,101,250,1234,99999];
const voices=()=>(speechSynthesis.getVoices()||[]).filter(v=>v.lang&&v.lang.toLowerCase().startsWith('th'));
const st=m=>document.getElementById('st').textContent=m;
// 今のアプリと同じ: เจ็ด→เจ้ด、7だけのときは声の高さ0.7
function playNow(n){stopAll();const t=thaiNumber(n);const u=new SpeechSynthesisUtterance(t.replace(/เจ็ด/g,'เจ้ด'));u.lang='th-TH';u.rate=0.85;u.pitch=(t==='เจ็ด')?0.7:1;const v=voices()[0];if(v)u.voice=v;speechSynthesis.speak(u);}

let ctx=null, bufs=null, playing=[];
function stopAll(){speechSynthesis.cancel();playing.forEach(s=>{try{s.stop();}catch(e){}});playing=[];}
// 音の始まり・終わり(10msごとの音量が一番大きい所から-30dB)を測る
function measure(b){const x=b.getChannelData(0),hop=Math.round(b.sampleRate*0.01),env=[];for(let i=0;i+hop<=x.length;i+=hop){let s=0;for(let j=i;j<i+hop;j++)s+=x[j]*x[j];env.push(Math.sqrt(s/hop));}
  const pk=Math.max(...env),th=pk*Math.pow(10,-30/20);let on=env.findIndex(e=>e>th),end=env.length-1;while(end>0&&env[end]<=th)end--;return {on:on*0.01,end:(end+1)*0.01};}
async function ready(){
  if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();}
  if(ctx.state!=='running') await ctx.resume();
  if(!bufs){st('録音を読み込み中…');const names=[...new Set(Object.values(CLIP))];const out={};
    await Promise.all(names.map(async n=>{const ab=await (await fetch('audio/num/'+n+'.m4a',{cache:'no-store'})).arrayBuffer();const b=await new Promise((ok,ng)=>ctx.decodeAudioData(ab,ok,ng));out[n]={buf:b,...measure(b)};}));
    bufs=out;st('');}
}
async function playA(n){
  stopAll();
  try{await ready();}catch(e){st('録音を読み込めませんでした: '+e);return;}
  const gap=(+document.getElementById('gap').value)/1000;
  let t=ctx.currentTime+0.05;
  for(const k of tokens(thaiNumber(n))){const c=bufs[CLIP[k]];const s=ctx.createBufferSource();s.buffer=c.buf;s.connect(ctx.destination);s.start(t,c.on);playing.push(s);t+=(c.end-c.on)+gap;}
}
function freeVal(){const n=parseInt(document.getElementById('freeN').value,10);return (n>=1&&n<=9999999)?n:null;}
function freePlay(a){const n=freeVal();if(!n){st('1〜9,999,999の数字を入れてください');return;}st('');a?playA(n):playNow(n);}
function freeShow(){const n=freeVal();document.getElementById('freeTh').textContent=n?thaiNumber(n)+'(録音 '+tokens(thaiNumber(n)).length+'個)':'';}
document.getElementById('freeN').oninput=freeShow;freeShow();
const gv=()=>{const g=+document.getElementById('gap').value;document.getElementById('gapv').textContent=(g>0?'+':'')+g+'ms';};document.getElementById('gap').oninput=gv;gv();
document.getElementById('list').innerHTML=N.map(n=>`<div class="row"><div class="n">${n.toLocaleString('en-US')}<small>${thaiNumber(n)}</small></div><button onclick="playNow(${n})">今</button><button class="a" onclick="playA(${n})">A</button></div>`).join('');
</script>
</body></html>
