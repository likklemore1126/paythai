<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>7の音声テスト</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;padding:18px 16px 40px;background:#1d1c1b;color:#e8e2d6;font-family:-apple-system,"Hiragino Sans",sans-serif;}
h1{font-size:18px;margin:0 0 6px}
h2{font-size:15px;margin:22px 0 8px;color:#d49a78}
p{font-size:13px;color:#9a948a;line-height:1.7;margin:0 0 12px}
select{width:100%;padding:12px;border-radius:12px;background:#262523;color:#fff;border:1px solid #3b3935;font-size:15px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:14px;border:1px solid #3b3935;background:#262523;color:#fff;font-size:15px;text-align:left;font-family:inherit}
b{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;background:#d49a78;color:#1d1c1b;font-size:13px;flex-shrink:0}
span.t{font-size:20px}
small{display:block;color:#9a948a;font-size:11px}
#vinfo{font-size:12px;color:#9a948a;margin-top:6px}
</style></head><body>
<h1>🔊 数字「7」の音声テスト(5回目)</h1>
<p>① iPhoneに入っているタイ語の声を選び、② ボタンを押して聞き比べてください。一番自然に聞こえる「声」と「記号」を教えてください。</p>
<h2>① タイ語の声</h2>
<select id="voice"></select>
<div id="vinfo"></div>
<h2>② 声の高さを変えて読ませる</h2>
<div class="g" id="list"></div>
<h2>③ 7が入った数字(声の高さ違い・分割)</h2>
<div class="g" id="list2"></div>
<script>
const T=[
 ['E','เจ้ด','今のアプリ(声の高さ 1.0)',0.85,1.0],
 ['E1','เจ้ด','声の高さ 0.9',0.85,0.9],
 ['E2','เจ้ด','声の高さ 0.8',0.85,0.8],
 ['E3','เจ้ด','声の高さ 0.7',0.85,0.7],
 ['D','เจ่ด','前回のD(1.0)',0.85,1.0],
 ['D1','เจ่ด','Dを声の高さ 1.1',0.85,1.1],
];
const T2=[['17 今','สิบเจ้ด',1.0],['17 0.9','สิบเจ้ด',0.9],['17 0.8','สิบเจ้ด',0.8],['17 0.7','สิบเจ้ด',0.7],['17 分割',['สิบ','เจ้ด']],
 ['70 今','เจ้ดสิบ',1.0],['70 0.9','เจ้ดสิบ',0.9],['70 0.8','เจ้ดสิบ',0.8],['70 0.7','เจ้ดสิบ',0.7],['70 分割',['เจ้ด','สิบ']],
 ['77 0.8','เจ้ดสิบเจ้ด',0.8],['77 分割',['เจ้ด','สิบ','เจ้ด']]];
// 分割: 7の部分だけ声の高さ0.7、ほかは1.0で、続けて読む
function speakParts(parts){const syn=speechSynthesis;syn.cancel();parts.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang='th-TH';u.rate=0.85;u.pitch=(t==='เจ้ด')?0.7:1;const v=voices[+document.getElementById('voice').value];if(v)u.voice=v;syn.speak(u);});}
let voices=[];
function load(){
  voices=(speechSynthesis.getVoices()||[]).filter(v=>v.lang&&v.lang.toLowerCase().startsWith('th'));
  const sel=document.getElementById('voice');
  sel.innerHTML=voices.length?voices.map((v,i)=>`<option value="${i}">${v.name}${/enhanced|premium/i.test(v.voiceURI)?'(高音質)':/compact/i.test(v.voiceURI)?'(標準)':''}</option>`).join(''):'<option>タイ語の声が見つかりません</option>';
  document.getElementById('vinfo').textContent=`タイ語の声:${voices.length}種類 / `+voices.map(v=>v.voiceURI).join(' , ');
}
speechSynthesis.onvoiceschanged=load; load(); setTimeout(load,800);
function speak(text,rate,pitch){const syn=speechSynthesis;syn.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='th-TH';u.rate=rate||0.85;u.pitch=pitch||1;const v=voices[+document.getElementById('voice').value];if(v)u.voice=v;syn.speak(u);}
document.getElementById('list').innerHTML=T.map((t,i)=>`<button onclick="speak(T[${i}][1],T[${i}][3],T[${i}][4])"><b>${t[0]}</b><div><span class="t">${t[1]}</span><small>${t[2]}</small></div></button>`).join('');
document.getElementById('list2').innerHTML=T2.map((t,i)=>`<button onclick="Array.isArray(T2[${i}][1])?speakParts(T2[${i}][1]):speak(T2[${i}][1],0.85,T2[${i}][2])"><b>${t[0]}</b><span class="t">${Array.isArray(t[1])?t[1].join('・'):t[1]}</span></button>`).join('');
</script>
</body></html>
