<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>7の音声テスト</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;padding:18px 16px 40px;background:#1d1c1b;color:#e8e2d6;font-family:-apple-system,"Hiragino Sans",sans-serif;}
h1{font-size:18px;margin:0 0 6px}
h2{font-size:15px;margin:22px 0 8px;color:#d49a78}
p{font-size:13px;color:#9a948a;line-height:1.7;margin:0 0 12px}
select{width:100%;padding:12px;border-radius:12px;background:#262523;color:#fff;border:1px solid #3b3935;font-size:15px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:14px;border:1px solid #3b3935;background:#262523;color:#fff;font-size:15px;text-align:left;font-family:inherit}
b{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;background:#d49a78;color:#1d1c1b;font-size:13px;flex-shrink:0}
span.t{font-size:20px}
small{display:block;color:#9a948a;font-size:11px}
#vinfo{font-size:12px;color:#9a948a;margin-top:6px}
</style></head><body>
<h1>🔊 数字「7」の音声テスト(2回目)</h1>
<p>① iPhoneに入っているタイ語の声を選び、② 1〜8を押して聞き比べてください。正しく「チェット」に聞こえた「声の名前」と「番号」を教えてください。</p>
<h2>① タイ語の声</h2>
<select id="voice"></select>
<div id="vinfo"></div>
<h2>② 7の書き方を変えて読ませる</h2>
<div class="g" id="list"></div>
<h2>③ 7が入った数字(1つ目の番号で正しければ、こちらも確認)</h2>
<div class="g" id="list2"></div>
<script>
const T=[
 ['1','เจ็ด','今と同じ'],
 ['2','เจ็ต','最後を ต に'],
 ['3','เจ็ท','最後を ท に'],
 ['4','เจ๊ด','声調記号を変える'],
 ['5','เจ็ด','速さ1.0',1.0],
 ['6','เจ็ด','ゆっくり0.6',0.6],
 ['7','เจ็ดๆ','ๆ を付ける'],
 ['8','เจ็ด ครับ','後ろに ครับ'],
];
const T2=[['17','สิบเจ็ด'],['17(2)','สิบเจ็ต'],['70','เจ็ดสิบ'],['70(2)','เจ็ตสิบ']];
let voices=[];
function load(){
  voices=(speechSynthesis.getVoices()||[]).filter(v=>v.lang&&v.lang.toLowerCase().startsWith('th'));
  const sel=document.getElementById('voice');
  sel.innerHTML=voices.length?voices.map((v,i)=>`<option value="${i}">${v.name}(${v.lang}${v.localService?'':'・オンライン'})</option>`).join(''):'<option>タイ語の声が見つかりません</option>';
  document.getElementById('vinfo').textContent=`タイ語の声:${voices.length}種類`;
}
speechSynthesis.onvoiceschanged=load; load(); setTimeout(load,800);
function speak(text,rate){const syn=speechSynthesis;syn.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='th-TH';u.rate=rate||0.85;const v=voices[+document.getElementById('voice').value];if(v)u.voice=v;syn.speak(u);}
document.getElementById('list').innerHTML=T.map((t,i)=>`<button onclick="speak(T[${i}][1],T[${i}][3])"><b>${t[0]}</b><div><span class="t">${t[1]}</span><small>${t[2]}</small></div></button>`).join('');
document.getElementById('list2').innerHTML=T2.map((t,i)=>`<button onclick="speak(T2[${i}][1])"><b>${t[0]}</b><span class="t">${t[1]}</span></button>`).join('');
</script>
</body></html>
