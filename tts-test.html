<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>7の音声テスト</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;padding:18px 16px 40px;background:#1d1c1b;color:#e8e2d6;font-family:-apple-system,"Hiragino Sans",sans-serif;}
h1{font-size:18px;margin:0 0 6px}
h2{font-size:15px;margin:22px 0 8px;color:#d49a78}
p{font-size:13px;color:#9a948a;line-height:1.7;margin:0 0 12px}
select{width:100%;padding:12px;border-radius:12px;background:#262523;color:#fff;border:1px solid #3b3935;font-size:15px}
.row{display:grid;grid-template-columns:76px 1fr 1fr;gap:8px;align-items:stretch;margin-bottom:8px}
.n{display:flex;flex-direction:column;justify-content:center;font-size:18px;font-weight:600}
.n small{font-weight:400}
button{padding:12px 10px;border-radius:14px;border:1px solid #3b3935;background:#262523;color:#fff;font-size:14px;font-family:inherit}
button.b{border-color:#d49a78;color:#f0c9b2}
button:active{opacity:.6}
small{display:block;color:#9a948a;font-size:11px}
#vinfo{font-size:12px;color:#9a948a;margin-top:6px}
#st{font-size:12px;color:#9a948a;margin-top:8px;min-height:1em}
</style></head><body>
<h1>🔊 数字「7」の音声テスト(6回目)</h1>
<p>左が<b>今のアプリ</b>(全部iPhoneの声)、右が<b>B</b>(7の部分だけ録音した音、ほかはiPhoneの声)です。<br>右の方が自然か、つなぎ目が気にならないかを聞いてください。<br>※録音はテスト用です(本番用は別に用意します)。</p>
<h2>① タイ語の声</h2>
<select id="voice"></select>
<div id="vinfo"></div>
<h2>② 聞き比べ</h2>
<div id="list"></div>
<div id="st"></div>
<script>
const R='REC';
// [表示, 今のアプリで読む文, Bの部品(REC=録音した7)]
const N=[
 ['7','เจ็ด',[R]],
 ['17','สิบเจ็ด',['สิบ',R]],
 ['27','ยี่สิบเจ็ด',['ยี่สิบ',R]],
 ['70','เจ็ดสิบ',[R,'สิบ']],
 ['77','เจ็ดสิบเจ็ด',[R,'สิบ',R]],
 ['107','หนึ่งร้อยเจ็ด',['หนึ่งร้อย',R]],
 ['700','เจ็ดร้อย',[R,'ร้อย']],
 ['777','เจ็ดร้อยเจ็ดสิบเจ็ด',[R,'ร้อย',R,'สิบ',R]],
 ['1,700','หนึ่งพันเจ็ดร้อย',['หนึ่งพัน',R,'ร้อย']],
 ['7,000','เจ็ดพัน',[R,'พัน']],
 ['27,500','สองหมื่นเจ็ดพันห้าร้อย',['สองหมื่น',R,'พันห้าร้อย']],
 ['70,000','เจ็ดหมื่น',[R,'หมื่น']],
];
let voices=[];
function load(){
  voices=(speechSynthesis.getVoices()||[]).filter(v=>v.lang&&v.lang.toLowerCase().startsWith('th'));
  const sel=document.getElementById('voice');
  sel.innerHTML=voices.length?voices.map((v,i)=>`<option value="${i}">${v.name}${/enhanced|premium/i.test(v.voiceURI)?'(高音質)':/compact/i.test(v.voiceURI)?'(標準)':''}</option>`).join(''):'<option>タイ語の声が見つかりません</option>';
  document.getElementById('vinfo').textContent=`タイ語の声:${voices.length}種類`;
}
speechSynthesis.onvoiceschanged=load; load(); setTimeout(load,800);
const st=m=>document.getElementById('st').textContent=m;

// 今のアプリと同じ: เจ็ด→เจ้ด、7だけのときは声の高さ0.7
function sayTTS(text,pitch){return new Promise(res=>{const u=new SpeechSynthesisUtterance(text);u.lang='th-TH';u.rate=0.85;u.pitch=pitch||1;const v=voices[+document.getElementById('voice').value];if(v)u.voice=v;let done=false;const fin=()=>{if(!done){done=true;res();}};u.onend=fin;u.onerror=fin;setTimeout(fin,6000);speechSynthesis.speak(u);});}
function playNow(i){speechSynthesis.cancel();runId++;const t=N[i][1];sayTTS(t.replace(/เจ็ด/g,'เจ้ด'),t==='เจ็ด'?0.7:1);}

// 録音の再生(Web Audio。最初のタップで有効化)
let ctx=null, buf=null, runId=0;
async function ready(){
  if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();}
  if(ctx.state!=='running') await ctx.resume();
  if(!buf){st('録音を読み込み中…');const ab=await (await fetch('audio/num7_test.m4a',{cache:'no-store'})).arrayBuffer();buf=await new Promise((ok,ng)=>ctx.decodeAudioData(ab,ok,ng));st('');}
}
function playRec(){return new Promise(res=>{const s=ctx.createBufferSource();s.buffer=buf;s.connect(ctx.destination);s.onended=res;s.start();});}
async function playB(i){
  speechSynthesis.cancel();const my=++runId;
  try{await ready();}catch(e){st('録音を読み込めませんでした: '+e);return;}
  for(const p of N[i][2]){ if(my!==runId) return; if(p===R) await playRec(); else await sayTTS(p,1); }
}
document.getElementById('list').innerHTML=N.map((n,i)=>`<div class="row"><div class="n">${n[0]}<small>${n[1]}</small></div><button onclick="playNow(${i})">今のアプリ</button><button class="b" onclick="playB(${i})">B 7だけ録音</button></div>`).join('');
</script>
</body></html>
