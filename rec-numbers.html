<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数字の録音用</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;padding:18px 16px 40px;background:#1d1c1b;color:#e8e2d6;font-family:-apple-system,"Hiragino Sans",sans-serif;}
h1{font-size:18px;margin:0 0 6px}
p{font-size:13px;color:#9a948a;line-height:1.7;margin:0 0 12px}
#big{height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;background:#262523;border:1px solid #3b3935;margin:12px 0}
#big .t{font-size:44px}
#big .s{font-size:13px;color:#9a948a}
.main{width:100%;padding:16px;border-radius:14px;border:1px solid #d49a78;background:#d49a78;color:#1d1c1b;font-size:17px;font-weight:700;font-family:inherit}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.g button{padding:10px 4px;border-radius:12px;border:1px solid #3b3935;background:#262523;color:#fff;font-size:17px;font-family:inherit}
.g small{display:block;font-size:10px;color:#9a948a}
#vinfo{font-size:12px;color:#9a948a}
</style></head><body>
<h1>🎙 数字の録音用ページ</h1>
<p>Pixelの画面録画を始めてから「全部を順番に再生」を押してください。19個の言葉を、アプリと同じ声・同じ速さで1つずつ読みます(約40秒)。最後に「おわり」と出たら録画を止めてください。</p>
<div id="vinfo"></div>
<div id="big"><div class="t">―</div><div class="s">待機中</div></div>
<button class="main" id="go">▶ 全部を順番に再生</button>
<div class="g" id="list"></div>
<script>
// 録音する言葉(この順番で切り分けるので、順番を変えないこと)
const W=[['ศูนย์','0'],['หนึ่ง','1'],['สอง','2'],['สาม','3'],['สี่','4'],['ห้า','5'],['หก','6'],['เจ็ด','7'],['แปด','8'],['เก้า','9'],
 ['สิบ','10'],['ยี่สิบ','20'],['ยี่','20の前半'],['เอ็ด','末尾の1'],['ร้อย','100'],['พัน','1,000'],['หมื่น','10,000'],['แสน','100,000'],['ล้าน','1,000,000']];
function voice(){return (speechSynthesis.getVoices()||[]).find(v=>v.lang&&v.lang.toLowerCase().startsWith('th'));}
function info(){const v=voice();document.getElementById('vinfo').textContent='使う声: '+(v?v.name:'(見つかりません)');}
speechSynthesis.onvoiceschanged=info;info();setTimeout(info,800);
// アプリの speak() と同じ設定(速さ0.85・最初のタイ語の声)。ttsFixは使わない(iPhone用の直しなので)
function say(t){return new Promise(res=>{const u=new SpeechSynthesisUtterance(t);u.lang='th-TH';u.rate=0.85;u.pitch=1;const v=voice();if(v)u.voice=v;let d=false;const f=()=>{if(!d){d=true;res();}};u.onend=f;u.onerror=f;setTimeout(f,5000);speechSynthesis.speak(u);});}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const big=(t,s)=>{document.querySelector('#big .t').textContent=t;document.querySelector('#big .s').textContent=s;};
let running=false;
document.getElementById('go').onclick=async()=>{
  if(running) return; running=true; speechSynthesis.cancel();
  big('…','2秒後に始まります'); await wait(2000);
  for(let i=0;i<W.length;i++){ big(W[i][0],`${i+1} / ${W.length}(${W[i][1]})`); await say(W[i][0]); await wait(1500); }
  big('おわり','録画を止めてください'); running=false;
};
document.getElementById('list').innerHTML=W.map((w,i)=>`<button onclick="speechSynthesis.cancel();say(W[${i}][0])">${w[0]}<small>${w[1]}</small></button>`).join('');
</script>
</body></html>
