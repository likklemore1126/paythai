<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1a1825;color:#f3ead8;font-family:'Zen Maru Gothic',sans-serif;padding:12px;}
h1{font-size:16px;color:#f2b705;padding:10px 0 6px;}

.stats{font-size:12px;color:#9c8d68;margin-bottom:10px;}
.item{background:#2b2118;border:1px solid #38353f;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.item-text{flex:1;min-width:0;}
.item-scene{font-size:10px;color:#9c8d68;margin-bottom:2px;}
.item-th{font-size:15px;color:#fff;margin-bottom:1px;}
.item-jp{font-size:12px;color:#9c8d68;}
.toggle{display:flex;border-radius:20px;overflow:hidden;border:1px solid #38353f;flex-shrink:0;}
.toggle button{padding:5px 10px;font-size:11px;border:none;cursor:pointer;font-weight:700;}
.btn-beg{background:#3a3742;color:#9c8d68;}
.btn-beg.active{background:#4c9a6a;color:#fff;}
.btn-int{background:#3a3742;color:#9c8d68;}
.btn-int.active{background:#4a7cc4;color:#fff;}
.export-btn{background:#f2b705;color:#2b2118;border:none;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:12px;}
.export-btn:active{opacity:.8;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center;padding:16px;}
.modal.show{display:flex;}
.modal-inner{background:#2b2118;border-radius:14px;padding:16px;width:100%;max-width:360px;}
.modal-inner textarea{width:100%;height:120px;background:#1a1825;border:1px solid #38353f;border-radius:8px;color:#f3ead8;font-size:11px;padding:8px;margin:8px 0;}
.modal-close{background:#38353f;color:#f3ead8;border:none;border-radius:8px;padding:10px;width:100%;cursor:pointer;font-size:13px;}
.copy-btn{background:#f2b705;color:#2b2118;border:none;border-radius:8px;padding:10px;width:100%;cursor:pointer;font-size:13px;font-weight:700;margin-bottom:6px;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">

</div>

  if (saved) {
    const levels = JSON.parse(saved);
    data = CONV_DEFAULT.map(item => ({
      ...item,
      level: levels[item.id] || item.level
    }));
  } else {
    data = CONV_DEFAULT.map(item => ({...item}));
  }
}

function saveLevel(id, level) {
  const saved = localStorage.getItem(STORAGE_KEY);
  const levels = saved ? JSON.parse(saved) : {};
  levels[id] = level;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(levels));
  const item = data.find(d => d.id === id);
  if (item) item.level = level;
  updateStats();
  // ボタンのUI更新
  const begBtn = document.querySelector(`[data-beg="${id}"]`);
  const intBtn = document.querySelector(`[data-int="${id}"]`);
  if (begBtn) begBtn.classList.toggle('active', level === 'beginner');
  if (intBtn) intBtn.classList.toggle('active', level === 'intermediate');
}

function setScene(scene) {
  currentScene = scene;
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.scene === scene);
  });
  renderList();
}

function updateStats() {
  const beg = data.filter(d => d.level === 'beginner').length;
  const mid = data.filter(d => d.level === 'intermediate').length;
  document.getElementById('stats').textContent = `全${data.length}件　🟢 初心者 ${beg}件　🔵 中級者+ ${mid}件`;
}

function renderList() {
  const filtered = currentScene === 'ALL' ? data : data.filter(d => d.scene === currentScene);
  const html = filtered.map(item => `
    <div class="item">
      <div class="item-text">
        <div class="item-scene">${item.scene}</div>
        <div class="item-th">${item.th.replace(/\{PT\}|\{PR\}|\{PS\}|\{PSR\}/g,'')}</div>
        <div class="item-jp">${item.jp}</div>
      </div>
      <div class="toggle">
        <button class="btn-beg ${item.level==='beginner'?'active':''}" data-beg="${item.id}" onclick="saveLevel('${item.id}','beginner')">🟢</button>
        <button class="btn-int ${item.level==='intermediate'?'active':''}" data-int="${item.id}" onclick="saveLevel('${item.id}','intermediate')">🔵</button>
      </div>
    </div>
  `).join('');
  document.getElementById('list').innerHTML = html;
}

function showExport() {
  const saved = localStorage.getItem(STORAGE_KEY);
  const levels = saved ? JSON.parse(saved) : {};
  const exportData = CONV_DEFAULT.map(item => ({
    ...item,
    level: levels[item.id] || item.level
  }));
  const text = 'const CONV = ' + JSON.stringify(exportData) + ';';
  document.getElementById('exportText').value = text;
  document.getElementById('modal').classList.add('show');
}

function copyExport() {
  const ta = document.getElementById('exportText');
  ta.select();
  document.execCommand('copy');
  alert('コピーしました！app.htmlの const CONV = [...]; 部分と置き換えてください');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

// 初期化
loadData();

// シーンタブ生成
const filterRow = document.getElementById('filterRow');
SCENES.forEach(scene => {
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.dataset.scene = scene;
  btn.textContent = scene;
  btn.onclick = () => setScene(scene);
  filterRow.appendChild(btn);
});

updateStats();
renderList();
</script>
</body>
</html>
